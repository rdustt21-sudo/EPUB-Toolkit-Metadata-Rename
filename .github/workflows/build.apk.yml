
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. AUTOMATICALLY FIND AND EXTRACT ANDROID SOURCE ZIP
      - name: Find and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          found_source=""

          while IFS= read -r zip_file; do
            [ -n "$zip_file" ] || continue

            echo "Checking ZIP: $zip_file"

            candidate="$RUNNER_TEMP/source_candidate"
            rm -rf "$candidate"
            mkdir -p "$candidate"

            if ! unzip -q "$zip_file" -d "$candidate"; then
              echo "Skipping invalid ZIP: $zip_file"
              continue
            fi

            gradle_file="$(
              find "$candidate" -type f \
                \( -name build.gradle -o -name build.gradle.kts \) \
                | grep -E '/app/build\.gradle(\.kts)?$' \
                | head -n 1 || true
            )"

            if [ -z "$gradle_file" ]; then
              echo "No Android app Gradle file found. Skipping."
              continue
            fi

            app_dir="$(dirname "$gradle_file")"
            project_root="$(dirname "$app_dir")"

            if [ ! -f "$project_root/gradlew" ]; then
              echo "No Gradle wrapper found. Skipping."
              continue
            fi

            found_source="$zip_file"

            rm -rf project
            mkdir -p project
            cp -a "$candidate/." project/

            break

          done < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ -z "$found_source" ]; then
            echo "::error::No valid Android source ZIP found."
            exit 1
          fi

          echo "Selected source ZIP: $found_source"
          echo "Android source successfully extracted."

      # 2. CONFIGURE APPLICATION ID AND VERSION
      - name: Configure application ID and version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$(
            find project -type f \
              \( -path '*/app/build.gradle' \
              -o -path '*/app/build.gradle.kts' \) \
              | head -n 1
          )"

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$(dirname "$APP_GRADLE")")"

          echo "APP_GRADLE=$APP_GRADLE" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          if [[ "$APP_GRADLE" == *.gradle.kts ]]; then
            sed -i -E \
              's/^[[:space:]]*applicationId[[:space:]]*=.*/        applicationId = "com.rdustt21.epubtoolkit.v5"/' \
              "$APP_GRADLE"

            sed -i -E \
              's/^[[:space:]]*versionCode[[:space:]]*=.*/        versionCode = 100011/' \
              "$APP_GRADLE"
          else
            sed -i -E \
              's/^[[:space:]]*applicationId[[:space:]].*/        applicationId "com.rdustt21.epubtoolkit.v5"/' \
              "$APP_GRADLE"

            sed -i -E \
              's/^[[:space:]]*versionCode[[:space:]].*/        versionCode 100011/' \
              "$APP_GRADLE"
          fi

          echo "Application ID configured."
          echo "Version code configured."

      # 3. JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. RESTORE PERSISTENT SIGNING KEY
      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::V5_DEBUG_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # 6. BUILD APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

          APK_PATH="$(
            find app/build/outputs/apk \
              -type f -name '*.apk' \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-unsigned.apk"

      # 7. SIGN APK
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/output/app.apk" \
            "$GITHUB_WORKSPACE/output/app-unsigned.apk"

      # 8. VERIFY SIGNATURE
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/output/app.apk"

      # 9. VERIFY PERSISTENT CERTIFICATE
      - name: Verify persistent signing certificate
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="1e3839d0f823fc8c7fcd2888cd8901942e56b5e663995040aefabb104fde006a"

          ACTUAL="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs "$GITHUB_WORKSPACE/output/app.apk" \
              | grep 'Signer #1 certificate SHA-256 digest' \
              | head -n 1 \
              | awk '{print $NF}' \
              | tr -d ':'
          )"

          ACTUAL="$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch!"
            exit 1
          fi

          echo "Persistent certificate verified."

      # 10. VERIFY PACKAGE ID
      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/app.apk"

          PACKAGE="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
              | grep "^package:" \
              | head -n 1 \
              | sed -n "s/.*name='\([^']*\)'.*/\1/p"
          )"

          EXPECTED="com.rdustt21.epubtoolkit.v5"

          echo "Expected: $EXPECTED"
          echo "Actual:   $PACKAGE"

          if [ "$PACKAGE" != "$EXPECTED" ]; then
            echo "::error::Unexpected package ID!"
            exit 1
          fi

          echo "Package ID verified."

      # 11. LOCATE FINAL APK
      - name: Locate APK
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/app.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Final APK not found."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 12. BACKUP APK ARTIFACT
      - name: Upload APK backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: output/app.apk
          if-no-files-found: error
          retention-days: 30

      # 13. AUTOMATICALLY CREATE GITHUB RELEASE
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}-${{ github.run_attempt }}
          name: EPUB Toolkit V5 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated APK build.

            Download the APK below and install it on your Android device.
          files: ${{ steps.locate.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
