
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$SOURCE_ZIP" ]; then
            echo "ERROR: Android source ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $SOURCE_ZIP"

          SOURCE_ROOT="$RUNNER_TEMP/android_source"
          mkdir -p "$SOURCE_ROOT"

          unzip -q "$SOURCE_ZIP" -d "$SOURCE_ROOT"

          echo "Extracted ZIP contents:"
          find "$SOURCE_ROOT" -maxdepth 3 -type f | head -n 100

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ROOT="$RUNNER_TEMP/android_source"

          APP_GRADLE="$(find "$SOURCE_ROOT" -type f \( -name build.gradle -o -name build.gradle.kts \) | grep '/app/build.gradle' | head -n 1 || true)"

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app Gradle file not found."
            find "$SOURCE_ROOT" -type f
            exit 1
          fi

          APP_DIR="$(dirname "$APP_GRADLE")"
          PROJECT_ROOT=""

          CURRENT="$APP_DIR"

          while [ "$CURRENT" != "$SOURCE_ROOT" ] && [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/settings.gradle" ] || [ -f "$CURRENT/settings.gradle.kts" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi
            CURRENT="$(dirname "$CURRENT")"
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Gradle project root not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"
          cp -a "$PROJECT_ROOT/." "$GITHUB_WORKSPACE/project/"

          PROJECT_ROOT="$GITHUB_WORKSPACE/project"
          APP_DIR="$PROJECT_ROOT/app"

          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: app directory not found after extraction."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Detected project: $PROJECT_ROOT"
          echo "Detected app: $APP_DIR"

      - name: Configure Android version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE=""

          if [ -f "$APP_DIR/build.gradle" ]; then
            APP_GRADLE="$APP_DIR/build.gradle"
          elif [ -f "$APP_DIR/build.gradle.kts" ]; then
            APP_GRADLE="$APP_DIR/build.gradle.kts"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app Gradle file missing."
            exit 1
          fi

          python3 - "$APP_GRADLE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(
              r'versionCode\s+(\d+)',
              'versionCode 100011',
              content,
              count=1
          )

          content = re.sub(
              r'versionCode\s*=\s*(\d+)',
              'versionCode = 100011',
              content,
              count=1
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Android version configuration checked.")
          PY

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: V5_DEBUG_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/signing"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/signing/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon assembleDebug

          APK_PATH="$(find "$APP_DIR/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/app-debug-unsigned.apk"

      - name: Sign APK with persistent certificate
        shell: bash
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEY_ALIAS: androiddebugkey
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$GITHUB_WORKSPACE/app-release.apk" \
            "$GITHUB_WORKSPACE/app-debug-unsigned.apk"

          "$APKSIGNER" verify --verbose "$GITHUB_WORKSPACE/app-release.apk"

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_FINGERPRINT="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
              verify --print-certs "$GITHUB_WORKSPACE/app-release.apk" \
              | grep 'Signer #1 certificate SHA-256 digest' \
              | awk '{print $NF}' \
              | tr '[:upper:]' '[:lower:]'
          )"

          EXPECTED_FINGERPRINT="1e3839d0f823fc8c7fcd2888cd8901942e56b5e663995040aefabb104fde006a"

          echo "Actual certificate:   $ACTUAL_FINGERPRINT"
          echo "Expected certificate: $EXPECTED_FINGERPRINT"

          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "ERROR: Signing certificate mismatch!"
            exit 1
          fi

          echo "Persistent certificate verified successfully."

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK missing or empty."
            exit 1
          fi

          echo "APK size:"
          ls -lh "$APK"

          echo "APK package information:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-APK
          path: app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: APK Build ${{ github.run_number }}
          files: app-release.apk
          generate_release_notes: true
