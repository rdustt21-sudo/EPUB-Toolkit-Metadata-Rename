
name: Build APK - Persistent Signing

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. EXTRACT SOURCE
      - name: Extract V5 source
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_ZIP="EPUB-Toolkit-V5.0.24-Safe-Import-Cleanup.zip"

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP"
            exit 1
          fi

          mkdir -p project
          unzip -q "$SOURCE_ZIP" -d project

          echo "Source extracted successfully."

      # 2. CONFIGURE APPLICATION ID AND VERSION
      - name: Configure application identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$(find project -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | grep '/app/build.gradle' \
            | head -n 1)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          python3 - "$GRADLE_FILE" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          app_pattern = r'(applicationId\s*(?:=\s*)?)(["\'])([^"\']+)(\2)'

          content, app_count = re.subn(
              app_pattern,
              lambda m: m.group(1) + '"com.rdustt21.epubtoolkit.v5"',
              content,
              count=1
          )

          if app_count != 1:
              raise SystemExit("ERROR: Could not configure applicationId.")

          version_pattern = r'(versionCode\s*(?:=\s*)?)\d+'

          content, version_count = re.subn(
              version_pattern,
              lambda m: m.group(1) + '100011',
              content,
              count=1
          )

          if version_count != 1:
              raise SystemExit("ERROR: Could not configure versionCode.")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Application ID configured.")
          print("Version code configured.")
          PY

      # 3. SET UP JAVA
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4. SET UP GRADLE
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 5. SET UP ANDROID SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 6. RESTORE PERSISTENT KEYSTORE
      - name: Restore persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::V5_DEBUG_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          test -s "$HOME/.android/debug.keystore"

          echo "Persistent keystore restored."

      # 7. BUILD APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$(find project -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | grep '/app/build.gradle' \
            | head -n 1)"

          if [ -z "$APP_GRADLE" ]; then
            echo "::error::App Gradle file not found."
            exit 1
          fi

          APP_DIR="$(dirname "$APP_GRADLE")"
          PROJECT_ROOT="$(dirname "$APP_DIR")"

          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"

            "$PROJECT_ROOT/gradlew" \
              -p "$PROJECT_ROOT" \
              assembleDebug \
              --no-daemon
          else
            gradle \
              -p "$PROJECT_ROOT" \
              assembleDebug \
              --no-daemon
          fi

      # 8. SIGN AND VERIFY PERSISTENT CERTIFICATE
      - name: Enforce persistent APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find project -type f \
            -path '*/app/build/outputs/apk/debug/app-debug.apk' \
            | head -n 1)"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::Built APK not found."
            exit 1
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)"

          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          # Extract persistent key fingerprint
          KEY_CERT_SHA256="$(keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | openssl dgst -sha256 \
            | awk '{print $2}' \
            | tr '[:upper:]' '[:lower:]')"

          if [ -z "$KEY_CERT_SHA256" ]; then
            echo "::error::Could not extract keystore fingerprint."
            exit 1
          fi

          echo "Persistent certificate:"
          echo "$KEY_CERT_SHA256"

          # Sign APK
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

          # Verify signature
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # CORRECTLY extract SHA-256 digest
          APK_CERT_SHA256="$("$APKSIGNER" verify \
            --print-certs "$APK" \
            | grep 'certificate SHA-256 digest:' \
            | head -n 1 \
            | sed 's/^.*digest:[[:space:]]*//' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          echo "APK certificate:"
          echo "$APK_CERT_SHA256"

          if [ -z "$APK_CERT_SHA256" ]; then
            echo "::error::Could not extract APK certificate fingerprint."
            exit 1
          fi

          # Compare fingerprints
          if [ "$KEY_CERT_SHA256" != "$APK_CERT_SHA256" ]; then
            echo "::error::APK certificate does not match persistent keystore."
            exit 1
          fi

          echo "CERTIFICATE MATCH CONFIRMED"

      # 9. VERIFY PACKAGE ID
      - name: Verify APK identity
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find project -type f \
            -path '*/app/build/outputs/apk/debug/app-debug.apk' \
            | head -n 1)"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)"

          APKANALYZER="$BUILD_TOOLS/apkanalyzer"

          APK_PACKAGE="$("$APKANALYZER" manifest application-id "$APK")"

          EXPECTED_PACKAGE="com.rdustt21.epubtoolkit.v5"

          if [ "$APK_PACKAGE" != "$EXPECTED_PACKAGE" ]; then
            echo "::error::Wrong APK package ID: $APK_PACKAGE"
            exit 1
          fi

          echo "Package ID verified: $APK_PACKAGE"
          echo "FINAL APK VERIFICATION PASSED"

      # 10. UPLOAD VERIFIED APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-Signed
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
