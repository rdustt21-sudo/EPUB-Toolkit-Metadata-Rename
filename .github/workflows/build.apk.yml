
      - name: Enforce persistent APK signing certificate
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$HOME/.android/debug.keystore"

          test -f "$APK"
          test -n "$KEYSTORE_BASE64"
          test -f "$KEYSTORE"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          echo "Extracting persistent certificate fingerprint..."

          KEY_CERT_SHA256="$(keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            | openssl dgst -sha256 \
            | awk '{print $2}' \
            | tr '[:upper:]' '[:lower:]')"

          echo "Persistent certificate:"
          echo "$KEY_CERT_SHA256"

          echo "Signing final APK with persistent key..."

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" \
            | grep 'Signer #1 certificate SHA-256 digest:' \
            | head -n 1 \
            | awk -F': ' '{print $2}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          echo "APK certificate:"
          echo "$APK_CERT_SHA256"

          echo "Comparing signing certificates..."

          if [ "$KEY_CERT_SHA256" != "$APK_CERT_SHA256" ]; then
            echo "::error::APK signing certificate does not match persistent keystore."
            echo "::error::Build rejected."
            exit 1
          fi

          echo "========================================"
          echo "SIGNING CERTIFICATE MATCH CONFIRMED"
          echo "========================================"

          echo "APK signed with persistent certificate."
