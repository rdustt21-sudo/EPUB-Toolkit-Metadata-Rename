
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. AUTOMATICALLY FIND AND EXTRACT SOURCE ZIP
      - name: Detect and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          found_source=""

          while IFS= read -r zip_file; do
            [ -n "$zip_file" ] || continue

            echo "Checking: $zip_file"

            candidate="$RUNNER_TEMP/source_candidate"
            rm -rf "$candidate"
            mkdir -p "$candidate"

            if ! unzip -q "$zip_file" -d "$candidate"; then
              echo "Skipping invalid ZIP."
              continue
            fi

            APP_GRADLE="$(find "$candidate" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              | grep -E '/app/build\.gradle(\.kts)?$' \
              | head -n 1 || true)"

            if [ -z "$APP_GRADLE" ]; then
              echo "No app Gradle file found. Skipping."
              continue
            fi

            APP_DIR="$(dirname "$APP_GRADLE")"
            PROJECT_ROOT="$(dirname "$APP_DIR")"

            if [ ! -f "$PROJECT_ROOT/settings.gradle" ] && \
               [ ! -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
              echo "No Gradle settings file found. Skipping."
              continue
            fi

            found_source="$zip_file"

            rm -rf project
            mkdir -p project
            cp -a "$candidate/." project/

            # Recalculate paths after extraction.
            APP_GRADLE_REL="${APP_GRADLE#"$candidate"/}"
            PROJECT_ROOT_REL="${PROJECT_ROOT#"$candidate"/}"

            echo "APP_GRADLE=project/$APP_GRADLE_REL" >> "$GITHUB_ENV"
            echo "PROJECT_ROOT=project/$PROJECT_ROOT_REL" >> "$GITHUB_ENV"

            break

          done < <(
            find . -maxdepth 1 -type f -iname '*.zip' -print | sort
          )

          if [ -z "$found_source" ]; then
            echo "::error::No valid Android project ZIP found."
            exit 1
          fi

          echo "========================================"
          echo "Selected ZIP: $found_source"
          echo "Android project extracted successfully."
          echo "========================================"

      # 2. CONFIGURE PACKAGE ID AND AUTOMATIC VERSION CODE
      - name: Configure application ID and version
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail

          VERSION_CODE=$((100000 + VERSION_CODE))

          python3 <<'PY'
          import os
          import re

          gradle_file = os.environ["APP_GRADLE"]
          version_code = os.environ["VERSION_CODE"]
          package_id = "com.rdustt21.epubtoolkit.v5"

          with open(gradle_file, "r", encoding="utf-8") as f:
              content = f.read()

          is_kotlin = gradle_file.endswith(".kts")

          if is_kotlin:
              app_id_line = f'        applicationId = "{package_id}"'
              version_line = f'        versionCode = {version_code}'
          else:
              app_id_line = f'        applicationId "{package_id}"'
              version_line = f'        versionCode {version_code}'

          # Replace existing applicationId.
          if re.search(r'(?m)^\s*applicationId\s*(?:=)?\s*["\'].*?["\']', content):
              content = re.sub(
                  r'(?m)^\s*applicationId\s*(?:=)?\s*["\'].*?["\'].*$',
                  app_id_line,
                  content,
                  count=1
              )
          else:
              content = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'\1\n' + app_id_line,
                  content,
                  count=1
              )

          # Replace existing versionCode.
          if re.search(r'(?m)^\s*versionCode\s*(?:=)?\s*\d+', content):
              content = re.sub(
                  r'(?m)^\s*versionCode\s*(?:=)?\s*\d+.*$',
                  version_line,
                  content,
                  count=1
              )
          else:
              content = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'\1\n' + version_line,
                  content,
                  count=1
              )

          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(content)

          print("Application ID:", package_id)
          print("Version code:", version_code)
          PY

      # 3. JAVA 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. INSTALL GRADLE WITHOUT DEPENDING ON ZIP WRAPPER
      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.7"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle ${GRADLE_VERSION} installed."

      # 6. RESTORE PERSISTENT SIGNING KEY
      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing keystore secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # 7. BUILD APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon assembleDebug

          APK_PATH="$(
            find app/build/outputs/apk \
              -type f -name '*.apk' \
              | sort \
              | head -n 1
          )"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-unsigned.apk"

          echo "APK build successful."

      # 8. SIGN APK
      - name: Sign APK with persistent certificate
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/output/app.apk" \
            "$GITHUB_WORKSPACE/output/app-unsigned.apk"

      # 9. VERIFY SIGNATURE
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/output/app.apk"

      # 10. VERIFY PERSISTENT CERTIFICATE
      - name: Verify signing certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="1e3839d0f823fc8c7fcd2888cd8901942e56b5e663995040aefabb104fde006a"

          ACTUAL="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs "$GITHUB_WORKSPACE/output/app.apk" \
              | grep 'Signer #1 certificate SHA-256 digest' \
              | head -n 1 \
              | awk '{print $NF}' \
              | tr -d ':'
          )"

          ACTUAL="$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch."
            exit 1
          fi

          echo "Persistent signing certificate verified."

      # 11. VERIFY PACKAGE ID
      - name: Verify APK package ID
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/app.apk"

          PACKAGE="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
              | grep "^package:" \
              | head -n 1 \
              | sed -n "s/.*name='\([^']*\)'.*/\1/p"
          )"

          EXPECTED="com.rdustt21.epubtoolkit.v5"

          echo "Expected: $EXPECTED"
          echo "Actual:   $PACKAGE"

          if [ "$PACKAGE" != "$EXPECTED" ]; then
            echo "::error::Package ID mismatch."
            exit 1
          fi

          echo "Package ID verified."

      # 12. UPLOAD APK ARTIFACT BACKUP
      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: output/app.apk
          if-no-files-found: error
          retention-days: 30

      # 13. AUTOMATIC GITHUB RELEASE
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: EPUB Toolkit V5 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated APK build.

            - APK built successfully.
            - Signed using the persistent signing certificate.
            - Package ID verified.

            Download app.apk below to install.
          files: output/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
