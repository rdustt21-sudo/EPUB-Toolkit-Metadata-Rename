
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. FIND AND EXTRACT ANDROID PROJECT ZIP
      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=false

          while IFS= read -r ZIP_FILE; do
            echo "Checking ZIP: $ZIP_FILE"

            CANDIDATE="$RUNNER_TEMP/source_candidate"
            rm -rf "$CANDIDATE"
            mkdir -p "$CANDIDATE"

            if ! unzip -q "$ZIP_FILE" -d "$CANDIDATE"; then
              echo "Invalid ZIP. Skipping."
              continue
            fi

            APP_FILE="$(find "$CANDIDATE" -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              | grep '/app/build.gradle' \
              | head -n 1 || true)"

            if [ -z "$APP_FILE" ]; then
              echo "No app Gradle file found. Skipping."
              continue
            fi

            APP_DIR="$(dirname "$APP_FILE")"

            # Find the project root containing settings.gradle
            PROJECT_ROOT=""

            CURRENT="$APP_DIR"

            while [ "$CURRENT" != "$CANDIDATE" ] && \
                  [ "$CURRENT" != "/" ]; do

              if [ -f "$CURRENT/settings.gradle" ] || \
                 [ -f "$CURRENT/settings.gradle.kts" ]; then
                PROJECT_ROOT="$CURRENT"
                break
              fi

              CURRENT="$(dirname "$CURRENT")"
            done

            if [ -z "$PROJECT_ROOT" ]; then
              echo "Gradle settings not found. Skipping."
              continue
            fi

            echo "Found Android project:"
            echo "$PROJECT_ROOT"

            rm -rf project
            mkdir -p project
            cp -a "$PROJECT_ROOT/." project/

            APP_GRADLE_REL="${APP_FILE#"$PROJECT_ROOT"/}"
            APP_DIR_REL="$(dirname "$APP_GRADLE_REL")"

            echo "APP_GRADLE=project/$APP_GRADLE_REL" >> "$GITHUB_ENV"
            echo "APP_DIR=project/$APP_DIR_REL" >> "$GITHUB_ENV"
            echo "PROJECT_ROOT=project" >> "$GITHUB_ENV"

            FOUND=true
            break

          done < <(
            find "$GITHUB_WORKSPACE" -maxdepth 1 \
              -type f -iname '*.zip' | sort
          )

          if [ "$FOUND" != "true" ]; then
            echo "::error::No valid Android project ZIP found."
            exit 1
          fi

          echo "Android source extracted successfully."

      # 2. CONFIGURE PACKAGE AND VERSION
      - name: Configure application ID and version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          VERSION_CODE=$((100000 + RUN_NUMBER))
          export VERSION_CODE

          python3 <<'PY'
          import os
          import re

          gradle_file = os.environ["APP_GRADLE"]
          version_code = os.environ["VERSION_CODE"]
          package_id = "com.rdustt21.epubtoolkit.v5"

          with open(gradle_file, "r", encoding="utf-8") as f:
              content = f.read()

          is_kotlin = gradle_file.endswith(".kts")

          if is_kotlin:
              app_id_line = f'applicationId = "{package_id}"'
              version_line = f'versionCode = {version_code}'
          else:
              app_id_line = f'applicationId "{package_id}"'
              version_line = f'versionCode {version_code}'

          # Update or insert applicationId
          if re.search(r'(?m)^\s*applicationId\s*(?:=)?\s*["\'].*?["\']', content):
              content = re.sub(
                  r'(?m)^\s*applicationId\s*(?:=)?\s*["\'].*?["\'].*$',
                  "        " + app_id_line,
                  content,
                  count=1
              )
          else:
              content = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'\1\n        ' + app_id_line,
                  content,
                  count=1
              )

          # Update or insert versionCode
          if re.search(r'(?m)^\s*versionCode\s*(?:=)?\s*\d+', content):
              content = re.sub(
                  r'(?m)^\s*versionCode\s*(?:=)?\s*\d+.*$',
                  "        " + version_line,
                  content,
                  count=1
              )
          else:
              content = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'\1\n        ' + version_line,
                  content,
                  count=1
              )

          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(content)

          print("Package:", package_id)
          print("Version code:", version_code)
          PY

      # 3. JAVA
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. INSTALL GRADLE
      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.7"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      # 6. RESTORE PERSISTENT SIGNING KEY
      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing keystore secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # 7. BUILD APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon assembleDebug

          APK_PATH="$(find "$APP_DIR/build/outputs/apk" \
            -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found after build."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-unsigned.apk"

          echo "APK built successfully."

      # 8. SIGN APK
      - name: Sign APK with persistent certificate
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/output/app.apk" \
            "$GITHUB_WORKSPACE/output/app-unsigned.apk"

      # 9. VERIFY APK SIGNATURE
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/output/app.apk"

      # 10. VERIFY CERTIFICATE
      - name: Verify persistent signing certificate
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="1e3839d0f823fc8c7fcd2888cd8901942e56b5e663995040aefabb104fde006a"

          ACTUAL="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs "$GITHUB_WORKSPACE/output/app.apk" \
              | grep 'Signer #1 certificate SHA-256 digest' \
              | awk '{print $NF}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch."
            exit 1
          fi

          echo "Persistent signing certificate verified."

      # 11. VERIFY PACKAGE ID
      - name: Verify package ID
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
              "$GITHUB_WORKSPACE/output/app.apk" \
              | grep '^package:' \
              | sed -n "s/.*name='\([^']*\)'.*/\1/p"
          )"

          EXPECTED="com.rdustt21.epubtoolkit.v5"

          echo "Expected: $EXPECTED"
          echo "Actual:   $PACKAGE"

          if [ "$PACKAGE" != "$EXPECTED" ]; then
            echo "::error::Package ID mismatch."
            exit 1
          fi

          echo "Package ID verified."

      # 12. UPLOAD APK ARTIFACT
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: output/app.apk
          if-no-files-found: error
          retention-days: 30

      # 13. CREATE RELEASE
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: EPUB Toolkit V5 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated APK build.

            - APK compiled successfully.
            - Signed using the persistent signing certificate.
            - Signing certificate verified.
            - Package ID verified.

            Download app.apk to install.
          files: output/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
