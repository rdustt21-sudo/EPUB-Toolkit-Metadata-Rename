
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found."
            exit 1
          fi

          echo "Source ZIP: $ZIP_FILE"

          rm -rf "$RUNNER_TEMP/android_source"
          mkdir -p "$RUNNER_TEMP/android_source"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android_source"

          SOURCE_ROOT="$RUNNER_TEMP/android_source"

          if [ ! -f "$SOURCE_ROOT/settings.gradle" ] && \
             [ ! -f "$SOURCE_ROOT/settings.gradle.kts" ]; then
            echo "::error::settings.gradle not found at ZIP root."
            exit 1
          fi

          if [ ! -f "$SOURCE_ROOT/app/build.gradle" ] && \
             [ ! -f "$SOURCE_ROOT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          cp -a "$SOURCE_ROOT/." "$GITHUB_WORKSPACE/project/"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
          echo "APP_DIR=$GITHUB_WORKSPACE/project/app" >> "$GITHUB_ENV"
          echo "APP_GRADLE=$GITHUB_WORKSPACE/project/app/build.gradle" >> "$GITHUB_ENV"

          echo "Android project found successfully."
          echo "Project root: $GITHUB_WORKSPACE/project"

      - name: Configure application ID and version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          VERSION_CODE=$((100000 + RUN_NUMBER))

          python3 <<'PY'
          import os
          import re

          gradle_file = os.environ["APP_GRADLE"]
          version_code = os.environ["RUN_NUMBER"]
          version_code = str(100000 + int(version_code))
          package_id = "com.rdustt21.epubtoolkit.v5"

          with open(gradle_file, "r", encoding="utf-8") as f:
              content = f.read()

          content, app_id_count = re.subn(
              r"applicationId\s+['\"][^'\"]+['\"]",
              f"applicationId '{package_id}'",
              content,
              count=1
          )

          content, version_count = re.subn(
              r"versionCode\s+\d+",
              f"versionCode {version_code}",
              content,
              count=1
          )

          if app_id_count == 0:
              raise SystemExit("applicationId could not be updated.")

          if version_count == 0:
              raise SystemExit("versionCode could not be updated.")

          with open(gradle_file, "w", encoding="utf-8") as f:
              f.write(content)

          print("Package ID:", package_id)
          print("Version code:", version_code)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.7"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Restore persistent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing keystore secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/release.keystore"

          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          gradle --no-daemon assembleDebug

          APK_PATH="$(find "$APP_DIR/build/outputs/apk/debug" \
            -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not produced."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/app-unsigned.apk"

          echo "APK build completed."

      - name: Sign APK using persistent certificate
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/output/app.apk" \
            "$GITHUB_WORKSPACE/output/app-unsigned.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$GITHUB_WORKSPACE/output/app.apk"

      - name: Verify persistent signing certificate
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="1e3839d0f823fc8c7fcd2888cd8901942e56b5e663995040aefabb104fde006a"

          ACTUAL="$(
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
              --print-certs "$GITHUB_WORKSPACE/output/app.apk" \
              | grep 'Signer #1 certificate SHA-256 digest' \
              | awk '{print $NF}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          echo "Expected certificate: $EXPECTED"
          echo "Actual certificate:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Persistent signing certificate mismatch."
            exit 1
          fi

          echo "Persistent signing certificate verified."

      - name: Verify package ID
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
              "$GITHUB_WORKSPACE/output/app.apk" \
              | grep '^package:' \
              | sed -n "s/.*name='\([^']*\)'.*/\1/p"
          )"

          EXPECTED="com.rdustt21.epubtoolkit.v5"

          echo "Expected package: $EXPECTED"
          echo "Actual package:   $PACKAGE"

          if [ "$PACKAGE" != "$EXPECTED" ]; then
            echo "::error::Package ID mismatch."
            exit 1
          fi

          echo "Package ID verified."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: output/app.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: EPUB Toolkit V5 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Automated APK build.

            - Android project extracted and compiled.
            - Signed using persistent signing certificate.
            - Signing certificate verified.
            - Package ID verified.

            Download app.apk to install.
          files: output/app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
