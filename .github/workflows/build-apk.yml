
name: Build Android APK V5

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -euo pipefail
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [[ -z "$ZIP_FILE" ]]; then
            echo "Project ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source

      - name: Extract nested ZIP
        run: |
          set -euo pipefail
          count=0
          while inner=$(find source -name '*.zip' -print -quit) && [[ -n "$inner" ]]; do
            count=$((count+1))
            [[ $count -le 5 ]] || exit 1
            dest="source/extracted-$count"
            mkdir -p "$dest"
            mv "$inner" "/tmp/project-$count.zip"
            unzip -o "/tmp/project-$count.zip" -d "$dest"
          done

      - name: Locate Android project
        id: locate
        run: |
          set -euo pipefail
          project_file=$(find source \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          [[ -n "$project_file" ]] || exit 1
          project_dir=$(dirname "$project_file")
          [[ -d "$project_dir/app" ]] || exit 1
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "apk_path=$project_dir/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$KEYSTORE_BASE64" ]] || exit 1
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Verify APK
        run: |
          set -euo pipefail
          apk="${{ steps.locate.outputs.apk_path }}"
          [[ -f "$apk" ]] || exit 1
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}-${{ github.run_attempt }}
          name: EPUB Toolkit V5 Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: APK download
          files: ${{ steps.locate.outputs.apk_path }}
