
name: Build Android APK (Stable V5 Signing)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract outer ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)

          if [[ -z "$ZIP_FILE" ]]; then
            echo "ERROR: No project ZIP found in repository root" >&2
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d source

      - name: Extract nested project ZIPs
        shell: bash
        run: |
          set -euo pipefail
          count=0

          while inner=$(find source -type f -name '*.zip' -print -quit) && [[ -n "$inner" ]]; do
            count=$((count + 1))

            [[ $count -le 5 ]] || {
              echo "ERROR: Too many nested ZIP levels" >&2
              exit 1
            }

            dest="source/extracted-level-$count"
            mkdir -p "$dest"

            mv "$inner" "/tmp/project-level-$count.zip"
            unzip -o "/tmp/project-level-$count.zip" -d "$dest"
          done

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          project_file=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          [[ -n "$project_file" ]] || {
            echo "ERROR: Android project not found" >&2
            exit 1
          }

          project_dir=$(realpath "$(dirname "$project_file")")

          [[ -d "$project_dir/app" ]] || {
            echo "ERROR: app module missing" >&2
            exit 1
          }

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "apk_path=$project_dir/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install persistent V5 debug signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ERROR: GitHub secret V5_DEBUG_KEYSTORE_BASE64 is missing." >&2
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "Persistent debug keystore installed."

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          set -euo pipefail

          apk="${{ steps.locate.outputs.apk_path }}"

          [[ -f "$apk" ]] || {
            echo "ERROR: APK not generated" >&2
            exit 1
          }

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            -print | sort -V | tail -n 1)

          [[ -n "$BUILD_TOOLS_DIR" ]] || {
            echo "ERROR: Android Build Tools not found" >&2
            exit 1
          }

          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          [[ -f "$APKSIGNER" ]] || {
            echo "ERROR: apksigner not found at $APKSIGNER" >&2
            exit 1
          }

          echo "Using apksigner: $APKSIGNER"

          "$APKSIGNER" verify --print-certs "$apk"

          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-APK
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
