
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract outer ZIP and inner project ZIP
      - name: Extract project ZIP files
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No outer ZIP file found!"
            exit 1
          fi

          echo "Extracting outer ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

          INNER_ZIP=$(find source -type f -name '*.zip' | head -n 1)

          if [ -z "$INNER_ZIP" ]; then
            echo "ERROR: No inner project ZIP found!"
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "Extracting inner ZIP: $INNER_ZIP"

          mkdir -p source/android-project
          unzip -o "$INNER_ZIP" -d source/android-project

          echo "Extraction completed."

      # 3. Locate Android Gradle project
      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find source/android-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found!"
            echo "Extracted files:"
            find source/android-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found!"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "apk_path=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"

      # 4. Install Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 6. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 7. Build APK
      - name: Build Android APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-SecondSpace-APK
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          
