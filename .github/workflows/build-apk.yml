
name: Build V5 - Verified Source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select source by Gradle version
        id: source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob, zipfile, tempfile, os, re, shutil

          candidates = []

          for z in glob.glob("*.zip"):
              tmp = tempfile.mkdtemp(prefix="epub-check-")
              try:
                  with zipfile.ZipFile(z) as archive:
                      archive.extractall(tmp)

                  for root, dirs, files in os.walk(tmp):
                      if "settings.gradle" not in files and "settings.gradle.kts" not in files:
                          continue

                      gradle = os.path.join(root, "app", "build.gradle")
                      if not os.path.isfile(gradle):
                          continue

                      content = open(gradle, encoding="utf-8").read()

                      appid = re.search(r"applicationId\s+['\"]([^'\"]+)['\"]", content)
                      code = re.search(r"versionCode\s+(\d+)", content)
                      name = re.search(r"versionName\s+['\"]([^'\"]+)['\"]", content)

                      if not appid or not code or not name:
                          continue

                      if appid.group(1) != "com.rdustt21.epubtoolkit.v5":
                          continue

                      version_code = int(code.group(1))
                      version_name = name.group(1)

                      if version_code < 519:
                          continue

                      candidates.append({
                          "zip": z,
                          "root": root,
                          "code": version_code,
                          "name": version_name
                      })
              except Exception as e:
                  print(f"Skipped {z}: {e}")
              finally:
                  # Keep extracted candidates until selection.
                  pass

          if not candidates:
              raise SystemExit(
                  "STOP: No valid V5 source ZIP with versionCode >= 519 found."
              )

          candidates.sort(key=lambda x: x["code"], reverse=True)
          selected = candidates[0]

          print("SELECTED SOURCE:", selected["zip"])
          print("PROJECT ROOT:", selected["root"])
          print("VERSION NAME:", selected["name"])
          print("VERSION CODE:", selected["code"])

          shutil.rmtree("project", ignore_errors=True)
          shutil.copytree(selected["root"], "project")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("version_name=" + selected["name"] + "\n")
              f.write("version_code=" + str(selected["code"]) + "\n")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.V5_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Build APK
        working-directory: project
        run: |
          set -euo pipefail
          gradle assembleDebug

      - name: Verify APK identity and version
        shell: bash
        run: |
          set -euo pipefail

          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep "^package:"

          echo "$BADGING" | grep -F \
            "name='com.rdustt21.epubtoolkit.v5'" >/dev/null

          echo "$BADGING" | grep -F \
            "versionCode='${{ steps.source.outputs.version_code }}'" >/dev/null

          echo "$BADGING" | grep -F \
            "versionName='${{ steps.source.outputs.version_name }}'" >/dev/null

          "$APKSIGNER" verify --print-certs "$APK"

          echo "APK VERIFIED"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Toolkit-V5-${{ steps.source.outputs.version_name }}
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: verified-v${{ steps.source.outputs.version_name }}-${{ github.run_id }}
          name: EPUB Toolkit V5 ${{ steps.source.outputs.version_name }}
          prerelease: true
          generate_release_notes: false
          body: |
            Verified APK.
            Source version: ${{ steps.source.outputs.version_name }}
            Source versionCode: ${{ steps.source.outputs.version_code }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
